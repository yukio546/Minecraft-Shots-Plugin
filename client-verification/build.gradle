plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '1.0.0'
group = 'dev.drunkshyt.verify'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.158.0+26.2'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
loom {
    runs {
        configureEach {
            vmArg "-Ddrunkshyt.pack=${file('../dist/DrunkShyt-MinecraftFive-1.1.zip').absolutePath}"
            vmArg "-Ddrunkshyt.proof.dir=${file('../verification').absolutePath}"
            programArgs '--width', '1200', '--height', '900'
        }
    }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'drunkshyt-font-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
